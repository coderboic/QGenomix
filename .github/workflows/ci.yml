name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: .venv/bin/ruff check src tests scripts
      # the unit and smoke tests use toy cohorts, so CI needs no genome downloads
      - run: .venv/bin/python -m pytest -q -W ignore
