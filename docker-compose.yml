# docker compose up --build   ->  dashboard http://localhost:8501, API http://localhost:8000/docs
services:
  dashboard:
    build: .
    image: qgenomix:latest
    ports: ["8501:8501"]
  api:
    image: qgenomix:latest
    depends_on: [dashboard]
    command: ["python", "-m", "uvicorn", "qgenomix.app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
